name: Setup workspace
description: Set up pnpm, Node, caches, and dependencies.

inputs:
  node-version:
    description: Node version to install
    required: true
  pnpm-version:
    description: pnpm version to install. Must match the root packageManager and have a pnpm-<version>.sha256 file beside this action.
    required: true
  cache-prefix:
    description: Names this job's Turbo cache entry (e.g. checks, test-server). Every job reads every prefix; this only decides which entry the job writes back.
    required: true
  turbo-cache:
    description: Restore and save the Turbo cache. Set to "false" on runners where the cache costs more to move than the tasks cost to run.
    required: false
    default: "true"

runs:
  using: composite
  steps:
    - uses: ./.github/actions/setup-workspace-tools
      with:
        node-version: ${{ inputs.node-version }}
        pnpm-version: ${{ inputs.pnpm-version }}
    - uses: ./.github/actions/cache-workspace
      with:
        node-version: ${{ inputs.node-version }}
        cache-prefix: ${{ inputs.cache-prefix }}
        turbo-cache: ${{ inputs.turbo-cache }}
    - name: Install dependencies
      shell: bash
      run: bash .github/actions/setup-workspace/install-dependencies.sh
